<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimmini Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('Backgrounds_soutien.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #5a4d7a;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            flex: 1;
            text-align: center;
        }

        .provider-selector {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .provider-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .provider-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .provider-btn.active {
            background: white;
            color: #5a4d7a;
            border-color: white;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: linear-gradient(180deg, #fafafa 0%, #f0f0f0 100%);
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.assistant {
            align-items: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-content {
            background: #5a4d7a;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .message-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        #userInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        #userInput:focus {
            border-color: #5a4d7a;
        }

        #sendBtn {
            padding: 12px 30px;
            background: #5a4d7a;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #sendBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(90, 77, 122, 0.6);
            background: #6f5e94;
        }

        #sendBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 10px;
            color: #666;
            font-style: italic;
        }

        .loading.active {
            display: block;
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="provider-selector">
                <button class="provider-btn active" data-provider="openai">OpenAI</button>
                <button class="provider-btn" data-provider="gemini">Gemini</button>
            </div>
            <div class="header-title">💬 Jimmini Chat</div>
            <div style="width: 180px;"></div> <!-- Spacer for centering -->
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                <span class="message-label">Jimmini</span>
                <div class="message-content">
                    Hello! I'm Jimmini powered by OpenAI. Ask me anything!
                </div>
            </div>
        </div>

        <div class="loading" id="loadingIndicator">
            Jimmini is thinking...
        </div>
        
        <div class="chat-input-container">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Type your message here..." 
                autocomplete="off"
            >
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const providerBtns = document.querySelectorAll('.provider-btn');
        
        let currentProvider = 'openai'; // Default to OpenAI

        // Provider selection
        providerBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const provider = btn.dataset.provider;
                
                // Update active state
                providerBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // Update current provider
                currentProvider = provider;
                
                // Clear chat and show welcome message
                clearChat();
                const providerName = provider === 'openai' ? 'OpenAI' : 'Gemini';
                addMessage('assistant', `Hello! I'm Jimmini powered by ${providerName}. Ask me anything!`);
            });
        });

        function clearChat() {
            chatMessages.innerHTML = '';
            // Also clear server-side history
            fetch('clear-history.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ provider: currentProvider })
            }).catch(err => console.error('Failed to clear history:', err));
        }

        // Send message when button is clicked
        sendBtn.addEventListener('click', sendMessage);

        // Send message when Enter is pressed
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = userInput.value.trim();
            
            if (message === '') return;

            // Add user message to chat
            addMessage('user', message);
            
            // Clear input
            userInput.value = '';
            
            // Disable input while processing
            userInput.disabled = true;
            sendBtn.disabled = true;
            loadingIndicator.classList.add('active');

            try {
                // Send request to unified API endpoint
                const response = await fetch('unified-api.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        message: message,
                        provider: currentProvider
                    })
                });

                const data = await response.json();

                if (data.success) {
                    addMessage('assistant', data.response);
                } else {
                    addMessage('assistant', '❌ Error: ' + data.error);
                }
            } catch (error) {
                addMessage('assistant', '❌ Connection error: ' + error.message);
            }

            // Re-enable input
            userInput.disabled = false;
            sendBtn.disabled = false;
            loadingIndicator.classList.remove('active');
            userInput.focus();
        }

        function addMessage(sender, text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const label = document.createElement('span');
            label.className = 'message-label';
            label.textContent = sender === 'user' ? 'You' : 'Jimmini';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;
            
            messageDiv.appendChild(label);
            messageDiv.appendChild(content);
            chatMessages.appendChild(messageDiv);
            
            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Focus input on load
        userInput.focus();
    </script>
</body>
</html>
