<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            width: 150px;
            height: 150px;
        }
        .icon-container {
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            cursor: move;
            position: relative;
            -webkit-app-region: drag;
        }
        .icon-container:hover {
            transform: scale(1.1);
        }
        img, video {
            width: 100%;
            height: 100%;
            pointer-events: none;
            transition: opacity 0.2s ease;
            -webkit-app-region: no-drag;
            object-fit: contain;
        }
        video {
            background: transparent;
        }
        .mascot-img, .mascot-video {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
        }
        .mascot-img.active, .mascot-video.active {
            opacity: 1;
        }
        .click-area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            -webkit-app-region: no-drag;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="icon-container">
        <!-- Main static image -->
        <img src="Ifen_logo_masc_1.png" alt="Mascot" class="mascot-img active" id="mainImg">
        <!-- Click animation - supports both WebM and MP4 -->
        <video class="mascot-video" id="animation1" muted playsinline>
            <source src="animation_1.webm" type="video/webm">
            <source src="animation_1.mp4" type="video/mp4">
        </video>
        <!-- Periodic/random animation - supports both WebM and MP4 -->
        <video class="mascot-video" id="animation2" muted playsinline>
            <source src="animation_2.webm" type="video/webm">
            <source src="animation_2.mp4" type="video/mp4">
        </video>
        <div class="click-area" id="clickArea"></div>
    </div>
    <script>
        const { ipcRenderer } = require('electron');
        
        const mainImg = document.getElementById('mainImg');
        const animation1 = document.getElementById('animation1');
        const animation2 = document.getElementById('animation2');
        const clickArea = document.getElementById('clickArea');

        // ==========================================
        // ANIMATION SETTINGS
        // ==========================================
        const ANIMATION2_MIN_INTERVAL = 10000; // Minimum time between random animations (10 seconds)
        const ANIMATION2_MAX_INTERVAL = 30000; // Maximum time between random animations (30 seconds)
        // ==========================================

        let isAnimating = false;
        let randomAnimationTimeout = null;

        // Function to show only one element
        function showOnly(element) {
            mainImg.classList.remove('active');
            animation1.classList.remove('active');
            animation2.classList.remove('active');
            element.classList.add('active');
        }

        // Play periodic/random animation (animation_2)
        function playRandomAnimation() {
            if (isAnimating) return;
            
            isAnimating = true;
            showOnly(animation2);

            // Reset and play the video
            animation2.currentTime = 0;
            animation2.play();

            // Wait for video to end, then return to main image
            animation2.onended = () => {
                showOnly(mainImg);
                isAnimating = false;
                scheduleNextRandomAnimation();
            };
        }

        // Schedule the next random animation
        function scheduleNextRandomAnimation() {
            if (randomAnimationTimeout) {
                clearTimeout(randomAnimationTimeout);
            }
            
            const delay = Math.random() * (ANIMATION2_MAX_INTERVAL - ANIMATION2_MIN_INTERVAL) + ANIMATION2_MIN_INTERVAL;
            randomAnimationTimeout = setTimeout(playRandomAnimation, delay);
        }

        // Play click animation (animation_1)
        function playClickAnimation() {
            if (isAnimating) return;
            
            isAnimating = true;
            
            // Cancel any pending random animation
            if (randomAnimationTimeout) {
                clearTimeout(randomAnimationTimeout);
            }

            showOnly(animation1);

            // Reset and play the video
            animation1.currentTime = 0;
            animation1.play();

            // Wait for video to end, then return to main image
            animation1.onended = () => {
                showOnly(mainImg);
                isAnimating = false;
                scheduleNextRandomAnimation();
            };
        }

        // Click handler
        clickArea.addEventListener('click', (e) => {
            e.stopPropagation();
            console.log('Icon clicked!');
            
            // Play click animation
            playClickAnimation();
            
            // Open chat window
            ipcRenderer.send('open-chat');
        });

        // Start the random animation cycle
        scheduleNextRandomAnimation();
    </script>
</body>
</html>
