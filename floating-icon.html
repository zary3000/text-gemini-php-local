<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            width: 75px;
            height: 75px;
        }
        .icon-container {
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            cursor: move;
            position: relative;
            -webkit-app-region: drag;
        }
        .icon-container:hover {
            transform: scale(1.1);
        }
        img {
            width: 100%;
            height: 100%;
            pointer-events: none;
            transition: opacity 0.2s ease;
            -webkit-app-region: no-drag;
        }
        .mascot-img {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
        }
        .mascot-img.active {
            opacity: 1;
        }
        .click-area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            -webkit-app-region: no-drag;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="icon-container">
        <!-- Main static image -->
        <img src="Ifen_logo_masc_1.png" alt="Mascot" class="mascot-img active" id="mainImg">
        <!-- Periodic animation GIF -->
        <img src="animation_1.gif" alt="Animation 1" class="mascot-img" id="animation1">
        <!-- Click animation GIF -->
        <img src="animation_2.gif" alt="Animation 2" class="mascot-img" id="animation2">
        <div class="click-area" id="clickArea"></div>
    </div>
    <script>
        const { ipcRenderer } = require('electron');
        
        const mainImg = document.getElementById('mainImg');
        const animation1 = document.getElementById('animation1');
        const animation2 = document.getElementById('animation2');
        const clickArea = document.getElementById('clickArea');

        // ==========================================
        // ANIMATION SETTINGS
        // ==========================================
        const ANIMATION1_DURATION = 2000; // How long animation_1 plays (in ms)
        const ANIMATION1_MIN_INTERVAL = 10000; // Minimum time between random animations (10 seconds)
        const ANIMATION1_MAX_INTERVAL = 30000; // Maximum time between random animations (30 seconds)
        const ANIMATION2_DURATION = 2000; // How long animation_2 plays when clicked (in ms)
        // ==========================================

        let isAnimating = false;
        let randomAnimationTimeout = null;

        // Function to show only one image
        function showOnly(imgElement) {
            mainImg.classList.remove('active');
            animation1.classList.remove('active');
            animation2.classList.remove('active');
            imgElement.classList.add('active');
        }

        // Play periodic/random animation (animation_1.gif)
        function playRandomAnimation() {
            if (isAnimating) return;
            
            isAnimating = true;
            showOnly(animation1);

            // Reset the GIF by reloading it
            const src = animation1.src;
            animation1.src = '';
            animation1.src = src;

            setTimeout(() => {
                showOnly(mainImg);
                isAnimating = false;
                scheduleNextRandomAnimation();
            }, ANIMATION1_DURATION);
        }

        // Schedule the next random animation
        function scheduleNextRandomAnimation() {
            if (randomAnimationTimeout) {
                clearTimeout(randomAnimationTimeout);
            }
            
            const delay = Math.random() * (ANIMATION1_MAX_INTERVAL - ANIMATION1_MIN_INTERVAL) + ANIMATION1_MIN_INTERVAL;
            randomAnimationTimeout = setTimeout(playRandomAnimation, delay);
        }

        // Play click animation (animation_2.gif)
        function playClickAnimation() {
            if (isAnimating) return;
            
            isAnimating = true;
            
            // Cancel any pending random animation
            if (randomAnimationTimeout) {
                clearTimeout(randomAnimationTimeout);
            }

            showOnly(animation2);

            // Reset the GIF by reloading it
            const src = animation2.src;
            animation2.src = '';
            animation2.src = src;

            setTimeout(() => {
                showOnly(mainImg);
                isAnimating = false;
                scheduleNextRandomAnimation();
            }, ANIMATION2_DURATION);
        }

        // Click handler
        clickArea.addEventListener('click', (e) => {
            e.stopPropagation();
            console.log('Icon clicked!');
            
            // Play click animation
            playClickAnimation();
            
            // Open chat window
            ipcRenderer.send('open-chat');
        });

        // Start the random animation cycle
        scheduleNextRandomAnimation();
    </script>
</body>
</html>
