<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            width: 150px;
            height: 150px;
        }
        .icon-container {
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            cursor: move;
            position: relative;
            -webkit-app-region: drag;
        }
        .icon-container:hover {
            transform: scale(1.1);
        }
        img {
            width: 100%;
            height: 100%;
            pointer-events: none;
            transition: opacity 0.2s ease;
            -webkit-app-region: no-drag;
        }
        .mascot-img {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
        }
        .mascot-img.active {
            opacity: 1;
        }
        .click-area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            -webkit-app-region: no-drag;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="icon-container">
        <!-- Main static image (fallback, rarely shown) -->
        <img src="Ifen_logo_masc_1.png" alt="Mascot" class="mascot-img" id="mainImg">
        <!-- Regular neutral animation (loops continuously) -->
        <img src="animation_neutral.gif" alt="Neutral" class="mascot-img active" id="animNeutral">
        <!-- Plush animation (shows every 4 loops) -->
        <img src="animation_plush.gif" alt="Plush" class="mascot-img" id="animPlush">
        <!-- Angry animation (rapid clicks) -->
        <img src="animation_angry.gif" alt="Angry" class="mascot-img" id="animAngry">
        <!-- Thinking animation (waiting for response) -->
        <img src="animation_thinking.gif" alt="Thinking" class="mascot-img" id="animThinking">
        <!-- Regret animation (closing chat) -->
        <img src="animation_regret.gif" alt="Regret" class="mascot-img" id="animRegret">
        <div class="click-area" id="clickArea"></div>
    </div>
    <script>
        const { ipcRenderer } = require('electron');
        
        const mainImg = document.getElementById('mainImg');
        const animNeutral = document.getElementById('animNeutral');
        const animPlush = document.getElementById('animPlush');
        const animAngry = document.getElementById('animAngry');
        const animThinking = document.getElementById('animThinking');
        const animRegret = document.getElementById('animRegret');
        const clickArea = document.getElementById('clickArea');

        // ==========================================
        // ANIMATION SETTINGS
        // ==========================================
        const NEUTRAL_LOOP_DURATION = 5000; // Duration of one neutral animation loop (ms)
        const PLUSH_EVERY_N_LOOPS = 4; // Show plush animation every N loops
        const PLUSH_DURATION = 5000; // Duration of plush animation (ms)
        
        const ANGRY_CLICK_COUNT = 3; // Number of clicks to trigger angry animation
        const ANGRY_CLICK_WINDOW = 2000; // Time window for rapid clicks (ms)
        const ANGRY_DURATION = 5000; // Duration of angry animation (ms)
        
        const REGRET_DURATION = 5000; // Duration of regret animation (ms)
        // ==========================================

        let currentState = 'neutral';
        let loopCount = 0;
        let neutralLoopTimeout = null;
        
        // Click tracking for angry animation
        let clickTimes = [];

        // Function to show only one image
        function showOnly(imgElement) {
            mainImg.classList.remove('active');
            animNeutral.classList.remove('active');
            animPlush.classList.remove('active');
            animAngry.classList.remove('active');
            animThinking.classList.remove('active');
            animRegret.classList.remove('active');
            imgElement.classList.add('active');
        }

        // Reset GIF by reloading source
        function resetGif(imgElement) {
            const src = imgElement.src;
            imgElement.src = '';
            imgElement.src = src;
        }

        // Start neutral animation loop
        function startNeutralLoop() {
            if (currentState !== 'neutral') return;
            
            loopCount++;
            
            // Every 4th loop, show plush animation
            if (loopCount % PLUSH_EVERY_N_LOOPS === 0) {
                showPlushAnimation();
            } else {
                showOnly(animNeutral);
                resetGif(animNeutral);
                
                neutralLoopTimeout = setTimeout(() => {
                    startNeutralLoop();
                }, NEUTRAL_LOOP_DURATION);
            }
        }

        // Show plush animation
        function showPlushAnimation() {
            showOnly(animPlush);
            resetGif(animPlush);
            
            setTimeout(() => {
                if (currentState === 'neutral') {
                    startNeutralLoop();
                }
            }, PLUSH_DURATION);
        }

        // Show angry animation (rapid clicks)
        function showAngryAnimation() {
            currentState = 'angry';
            if (neutralLoopTimeout) clearTimeout(neutralLoopTimeout);
            
            showOnly(animAngry);
            resetGif(animAngry);
            
            setTimeout(() => {
                currentState = 'neutral';
                startNeutralLoop();
            }, ANGRY_DURATION);
        }

        // Show thinking animation
        function showThinkingAnimation() {
            currentState = 'thinking';
            if (neutralLoopTimeout) clearTimeout(neutralLoopTimeout);
            
            showOnly(animThinking);
            resetGif(animThinking);
        }

        // Return to neutral from thinking
        function returnToNeutral() {
            if (currentState === 'thinking') {
                currentState = 'neutral';
                startNeutralLoop();
            }
        }

        // Show regret animation (closing chat)
        function showRegretAnimation() {
            currentState = 'regret';
            if (neutralLoopTimeout) clearTimeout(neutralLoopTimeout);
            
            showOnly(animRegret);
            resetGif(animRegret);
            
            setTimeout(() => {
                currentState = 'neutral';
                startNeutralLoop();
            }, REGRET_DURATION);
        }

        // Track clicks for angry animation
        function trackClick() {
            const now = Date.now();
            clickTimes.push(now);
            
            // Remove clicks outside the time window
            clickTimes = clickTimes.filter(time => now - time < ANGRY_CLICK_WINDOW);
            
            // Check if we have enough rapid clicks
            if (clickTimes.length >= ANGRY_CLICK_COUNT) {
                clickTimes = []; // Reset
                showAngryAnimation();
                return true; // Angry animation triggered
            }
            
            return false;
        }

        // Click handler
        clickArea.addEventListener('click', (e) => {
            e.stopPropagation();
            console.log('Icon clicked!');
            
            // Track click for angry animation
            const isAngry = trackClick();
            
            if (!isAngry) {
                // Open or close chat window
                ipcRenderer.send('toggle-chat');
            }
        });

        // Listen for chat state changes
        ipcRenderer.on('chat-opened', () => {
            console.log('Chat opened');
            // Continue normal animation when chat opens
        });

        ipcRenderer.on('chat-closed', () => {
            console.log('Chat closed - showing regret');
            showRegretAnimation();
        });

        // Listen for thinking state (when waiting for AI response)
        ipcRenderer.on('start-thinking', () => {
            console.log('Start thinking animation');
            showThinkingAnimation();
        });

        ipcRenderer.on('stop-thinking', () => {
            console.log('Stop thinking animation');
            returnToNeutral();
        });

        // Start the neutral loop on load
        startNeutralLoop();
    </script>
</body>
</html>
